<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crawleros-icon.svg?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102644" />
    <title>CrawlerOS</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 主题引导：首帧前写入 data-theme，避免白天/黑夜/纯黑切换闪烁（与 src/utils/theme.ts 保持同键）
      (function () {
        try {
          var mode = localStorage.getItem('crawler-theme-mode')
          var theme = mode === 'light' || mode === 'dark' || mode === 'black'
            ? mode
            : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'black' ? '#000000' : theme === 'dark' ? '#070d17' : '#f3f7f8')
        } catch (e) { /* 引导失败时保持默认白天 */ }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
