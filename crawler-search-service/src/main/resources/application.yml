server:
  port: 8083

spring:
  application:
    name: crawler-search-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:crawler_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  data:
    elasticsearch:
      uris: ${ES_URLS:http://127.0.0.1:9200}
      username: ${ES_USER:}
      password: ${ES_PASSWORD:}

app:
  es:
    content-index: ${ES_CONTENT_INDEX:spider_content}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS:admin}
  secretKey: ${MINIO_SECRET:admin123}
  html-bucket: ${MINIO_HTML_BUCKET:crawler}

jwt:
  secret: crawler-platform-jwt-secret-key-must-be-long-enough-256
  expire: 7200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.collect: INFO
