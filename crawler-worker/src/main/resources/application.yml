server:
  port: 8090

spring:
  application:
    name: crawler-worker
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/crawler_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
  rocketmq:
    name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
    consumer:
      group: worker-consumer-group
      consume-thread-min: 2
      consume-thread-max: 8
  data:
    elasticsearch:
      uris: ${ES_URLS:http://127.0.0.1:9200}
      username: ${ES_USER:}
      password: ${ES_PASSWORD:}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS:admin}
  secretKey: ${MINIO_SECRET:admin123}

logging:
  level:
    com.collect: INFO
