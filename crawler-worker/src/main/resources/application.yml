server:
  port: 8090

spring:
  application:
    name: crawler-worker
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.31.2}:${MYSQL_PORT:3306}/${MYSQL_DB:crawler_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mysql_FxYHD4}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.31.2:8848}
        namespace: ${NACOS_NAMESPACE:crawler-default}
  kafka:
    bootstrap-servers: 192.168.31.2:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:worker-consumer-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
  elasticsearch:
    uris: ${ES_URLS:http://192.168.31.2:9200}
    username: ${ES_USER:elastic}
    password: ${ES_PASSWORD:Elastic_dnw7WH}
  data:
    redis:
      host: ${REDIS_HOST:192.168.31.2}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_4rzHHD}
      database: 5

app:
  kafka:
    spider-task-topic: spider_task_topic-default
    task-log-topic: spider_task_log_topic-default
    task-log-consumer-group: task-log-consumer-group
  es:
    content-index: ${ES_CONTENT_INDEX:spider_content}
  http:
    # OkHttp 连接池/超时配置（crawler-worker）
    connect-timeout-seconds: ${HTTP_CONNECT_TIMEOUT_SECONDS:15}   # 连接建立超时
    read-timeout-seconds: ${HTTP_READ_TIMEOUT_SECONDS:30}         # 读取超时
    max-idle-connections: ${HTTP_MAX_IDLE_CONNECTIONS:512}        # 空闲连接上限，0=禁用连接池，-1=OkHttp默认(5)
    keep-alive-minutes: ${HTTP_KEEP_ALIVE_MINUTES:2}              # 空闲连接保留时长（分钟）
    max-concurrent-requests: ${HTTP_MAX_CONCURRENT_REQUESTS:2000} # 全部客户端合计的最大并发请求数（含排队），<=0=默认(64)
    max-concurrent-requests-per-client: ${HTTP_MAX_CONCURRENT_REQUESTS_PER_CLIENT:200} # 单客户端每主机并发上限，<=0=默认(5)
    max-concurrent-requests-per-task: ${HTTP_MAX_CONCURRENT_REQUESTS_PER_TASK:100}     # 单任务最大并发请求数（任务级 Dispatcher），防止一个任务独占全局槽位
    max-concurrent-requests-per-task-per-host: ${HTTP_MAX_CONCURRENT_REQUESTS_PER_TASK_PER_HOST:50} # 单任务每主机并发上限
    max-cached-clients: ${HTTP_MAX_CACHED_CLIENTS:128}            # 带自定义 Header 的客户端缓存上限
    max-response-bytes: ${HTTP_MAX_RESPONSE_BYTES:10485760}       # 响应体大小上限（字节），0=不限制
    retry-on-io-error: ${HTTP_RETRY_ON_IO_ERROR:1}                # 瞬时网络错误重试次数（仅幂等请求），0=不重试
    dns-cache-ttl-seconds: ${HTTP_DNS_CACHE_TTL_SECONDS:300}      # 本地 DNS 缓存 TTL（秒），0=禁用
    pool-metrics-log-seconds: ${HTTP_POOL_METRICS_LOG_SECONDS:60} # 连接池监控日志间隔（秒），0=关闭

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.31.2:9000}
  accessKey: ${MINIO_ACCESS:minio_ZzhWQ2}
  secretKey: ${MINIO_SECRET:minio_DhYfdD}
  image-bucket: ${MINIO_IMAGE_BUCKET:crawler}
  html-bucket: ${MINIO_HTML_BUCKET:crawler}
  js-bucket: ${MINIO_JS_BUCKET:crawler}

logging:
  level:
    com.collect: INFO
