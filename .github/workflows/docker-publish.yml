name: Build and publish Docker images

on:
  pull_request:
  push:
    branches:
      - release
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: crawler-gateway
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-gateway
          - service: crawler-user-service
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-user-service
          - service: crawler-spider-service
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-spider-service
          - service: crawler-search-service
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-search-service
          - service: crawler-file-service
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-file-service
          - service: crawler-worker
            context: .
            dockerfile: ./docker/Dockerfile-app
            build_arg: SERVICE=crawler-worker
          - service: crawler-admin-web
            context: ./crawler-admin-web
            dockerfile: ./crawler-admin-web/Dockerfile
            build_arg: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg }}
          push: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

      - name: Remove older image versions
        if: success() && github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
