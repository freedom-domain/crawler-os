server:
  port: 8087

spring:
  application:
    name: crawler-ai-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.31.2}:${MYSQL_PORT:3306}/${MYSQL_DB:crawler_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mysql_FxYHD4}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.31.2:8848}
        namespace: ${NACOS_NAMESPACE:crawler-default}
  elasticsearch:
    uris: ${ES_URLS:http://192.168.31.2:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: crawler-platform-jwt-secret-key-must-be-long-enough-256
  expire: 7200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.31.2:9000}
  accessKey: ${MINIO_ACCESS:minio_ZzhWQ2}
  secretKey: ${MINIO_SECRET:minio_DhYfdD}
  bucket: ${MINIO_BUCKET:crawler-knowledge}

app:
  ai:
    rag:
      source-index: ${RAG_SOURCE_INDEX:spider_content}
      vector-index-prefix: ${RAG_VECTOR_INDEX_PREFIX:spider_content_vector}
      vector-index-environment: ${RAG_VECTOR_INDEX_ENVIRONMENT:}
      # 内容索引新增文档后，定时向来源是该索引的知识库增量写入向量（默认开启，5 分钟一次）
      incremental-sync:
        enabled: ${RAG_INCREMENTAL_SYNC_ENABLED:true}
        interval-ms: ${RAG_INCREMENTAL_SYNC_INTERVAL_MS:300000}

logging:
  level:
    com.collect: INFO
