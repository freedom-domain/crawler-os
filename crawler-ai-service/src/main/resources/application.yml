server:
  port: 8087

spring:
  application:
    name: crawler-ai-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:crawler_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:crawler-default}
  elasticsearch:
    uris: ${ES_URLS:http://localhost:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: crawler-platform-jwt-secret-key-must-be-long-enough-256
  expire: 7200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.collect: INFO
